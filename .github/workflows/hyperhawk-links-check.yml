name: Hyperhawk

on:
  workflow_dispatch: 
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 0 * * 1'   # every Monday at midnight

jobs:
  link-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      # Pinned to the merge of dvdstelt/hyperhawk#34 (Jekyll support), not released yet.
      # Switch back to @v1 once a release ships it.
      - uses: dvdstelt/hyperhawk@6259b47385aeaebf579447b913526a4e4f6b2b79
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Resolve root-relative links against the pages Jekyll generates (posts,
          # collections, series, redirects), not only files on disk.
          site-generator: jekyll
          # Code samples contain placeholder URLs that aren't meant to resolve.
          skip-code-blocks: true
          # Some sites take well over 10 seconds to answer (archive.org, small blogs).
          timeout: 30000
          # Twitter/X and Esselunga block automated requests, so links there can't be verified.
          # Wayback Machine snapshots never change, and archive.org is often too slow to answer.
          ignore-patterns: '^https?://(www\.)?(twitter|x)\.com/,^https?://(www\.)?esselungaacasa\.it,^https://web\.archive\.org/web/'

  # Keep a single "Broken links" issue in sync with the weekly (and manual) runs.
  report:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: link-check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Update the broken links issue
        run: .github/scripts/update-broken-links-issue.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
