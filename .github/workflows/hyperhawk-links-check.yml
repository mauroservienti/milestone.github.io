name: Hyperhawk

on:
  workflow_dispatch: 
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 0 * * 1'   # every Monday at midnight

jobs:
  link-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dvdstelt/hyperhawk@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Root-relative links to pages Jekyll generates at build time (posts, collections,
          # series, redirects) have no matching file on disk, so Hyperhawk can't verify them.
          # Twitter/X blocks automated requests, so links there can't be verified.
          ignore-patterns: '^/\d{4}/\d{2}/\d{2}/,^/(view-model-composition|soa-search|categories|series|events|talks|tags)/,^https?://(www\.)?(twitter|x)\.com/'
